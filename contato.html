<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contato · Vozes dos Palmares</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script></head>
<body><div id="top"></div><main>
<div class="wrap"><div class="page-title"><h1>Contato</h1><p class="lead">Dúvidas, sugestões de livros ou vontade de ajudar? Escreva para o centro.</p></div>
<div class="cols2"><form class="box" id="f"><label for="nome">Nome</label><input id="nome" required maxlength="120" autocomplete="name">
<label for="email">Seu e-mail</label><input id="email" type="email" required maxlength="200" autocomplete="email">
<label for="msg">Mensagem</label><textarea id="msg" rows="6" required maxlength="3000"></textarea>
<div class="hp" aria-hidden="true"><label for="site">Não preencha</label><input id="site" tabindex="-1" autocomplete="off"></div>
<div id="m" class="msg" hidden role="status"></div><p><button class="btn" id="ok">Enviar mensagem</button></p></form>
<div><h2>O centro</h2><dl class="info" id="info"></dl>
<div id="gestao-contato" hidden><p><button class="btn alt" id="editar-contato" type="button">Editar dados de contato</button></p><p class="msg" id="contato-status" role="status" hidden></p></div></div></div></div>
<section class="wrap" id="caixa-mensagens" aria-labelledby="mensagens-titulo" hidden><h2 id="mensagens-titulo">Mensagens recebidas</h2><p class="msg" id="mensagens-aviso" role="status" hidden></p><div id="mensagens-lista"></div></section>
<dialog class="bk-dlg editor-pagina" id="contato-editor" aria-labelledby="contato-titulo">
<form class="box" id="contato-form"><h2 id="contato-titulo">Editar dados de contato</h2>
<label for="centro-endereco">Endereço</label><input id="centro-endereco" name="endereco" type="text" maxlength="300">
<label for="centro-horarios">Horários</label><input id="centro-horarios" name="horarios" type="text" maxlength="300">
<label for="centro-email">E-mail público</label><input id="centro-email" name="email" type="email" maxlength="300">
<label for="centro-telefone">Telefone</label><input id="centro-telefone" name="telefone" type="tel" maxlength="300">
<label for="centro-whatsapp">WhatsApp</label><input id="centro-whatsapp" name="whatsapp" type="tel" maxlength="300">
<label for="centro-mapa">Link do mapa</label><input id="centro-mapa" name="mapa" type="url" maxlength="2000">
<p class="msg err" id="contato-erro" role="alert" hidden></p>
<p class="editor-acoes"><button class="btn" type="submit">Salvar</button><button class="btn alt" type="button" id="contato-cancelar">Cancelar</button></p>
</form></dialog>
</main><div id="foot"></div>
<script>
(async()=>{const {admin}=await layout("contato.html");
if(admin){
 const lista=$("#mensagens-lista"), aviso=$("#mensagens-aviso");
 async function carregarMensagens(){
  await show(lista,sb.from("mensagens").select("*").order("created_at",{ascending:false}),m=>
   `<article class="rel"><strong>${esc(m.nome)}</strong> · ${esc(m.email)} · ${esc(fmt(m.created_at))}
   <p>${esc(m.mensagem)}</p><button class="btn danger" type="button" data-mensagem="${esc(m.id)}">Excluir mensagem</button></article>`,
   "Nenhuma mensagem recebida.");
 }
 $("#caixa-mensagens").hidden=false;
 lista.addEventListener("click",async e=>{
  const botao=e.target.closest("[data-mensagem]");
  if(!botao||botao.disabled||!confirm("Excluir esta mensagem?"))return;
  botao.disabled=true;
  const {data,error}=await sb.from("mensagens").delete().eq("id",botao.dataset.mensagem).select("id").maybeSingle();
  aviso.hidden=false;
  aviso.textContent=error||!data?"Não foi possível excluir a mensagem.":"Mensagem excluída.";
  if(error||!data)botao.disabled=false;
  else await carregarMensagens();
 });
 carregarMensagens();
}
let dadosCentro = await carregarDadosCentro();
const mostrarCentro = () => {
  $("#info").innerHTML = infoCentro(dadosCentro);
};
mostrarCentro();
if(admin){
 const dialogo=$("#contato-editor"), form=$("#contato-form"), erro=$("#contato-erro"), status=$("#contato-status");
 const salvar=form.querySelector('[type="submit"]'), cancelar=$("#contato-cancelar");
 const campos=[...form.querySelectorAll("input")];
 $("#gestao-contato").hidden=false;
 $("#editar-contato").onclick=()=>{
  erro.hidden=true;
  for(const campo of campos) campo.value=dadosCentro[campo.name]||"";
  dialogo.showModal();
  campos[0].focus();
 };
 cancelar.onclick=()=>dialogo.close();
 dialogo.addEventListener("cancel",e=>{if(salvar.disabled)e.preventDefault();});
 form.onsubmit=async e=>{
  e.preventDefault();
  if(salvar.disabled)return;
  salvar.disabled=cancelar.disabled=true;
  erro.hidden=true;
  try{
   const dados=Object.fromEntries(campos.map(campo=>[campo.name,campo.value.trim()]));
   if(dados.mapa&&!/^https?:\/\//i.test(dados.mapa))throw new Error("O link do mapa precisa começar com https:// ou http://.");
   const {data,error}=await sb.from("dados_centro").upsert({id:1,...dados}).select().single();
   if(error)throw error;
   dadosCentro=data;
   mostrarCentro();
   dialogo.close();
   status.textContent="Dados de contato atualizados.";
   status.hidden=false;
  }catch(falha){
   erro.textContent="Não foi possível salvar os dados de contato. "+falha.message;
   erro.hidden=false;
  }finally{
   salvar.disabled=cancelar.disabled=false;
  }
 };
}
const say=(t,err)=>{const m=$("#m");m.hidden=false;m.textContent=t;m.className="msg"+(err?" err":"");};
$("#f").onsubmit=async e=>{e.preventDefault();const b=$("#ok");b.disabled=true;
 const d={nome:$("#nome").value.trim(),email:$("#email").value.trim(),mensagem:$("#msg").value.trim()};
 if($("#site").value){say("Mensagem enviada!");b.disabled=false;return}
 const r1=await sb.from("mensagens").insert(d);
 let okMail=false;try{const r=await fetch("/api/contato",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});okMail=r.ok}catch(_){}
 if(r1.error&&!okMail)say("Não foi possível enviar agora. Tente de novo em instantes.",1);else{say("Mensagem enviada! Responderemos pelo e-mail informado.");e.target.reset()}
 b.disabled=false;};})();
</script></body></html>
