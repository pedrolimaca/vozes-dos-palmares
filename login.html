<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Vozes dos Palmares</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/auth-pt.js"></script><script src="js/config.js"></script><script src="js/app.js"></script></head>
<body><div id="top"></div><main>
<div class="wrap"><div class="page-title"><h1>Entrar</h1><p class="lead">A administração entra com a conta liberada pela equipe do site. Visitantes podem criar uma conta para publicar relatos na página do centro.</p></div>
<div class="tabs" role="tablist"><button role="tab" id="tl" aria-selected="true">Entrar</button><button role="tab" id="tc" aria-selected="false">Criar conta de visitante</button></div>
<form class="box" id="f"><div id="nw" hidden><label for="nome">Nome</label><input id="nome" autocomplete="name"></div>
<label for="email">E-mail</label><input id="email" type="email" required autocomplete="email">
<label for="senha">Senha</label><input id="senha" type="password" required minlength="6" autocomplete="current-password">
<div id="m" class="msg" hidden role="status"></div><p><button class="btn" id="ok">Entrar</button></p><p><button class="linkbtn" id="esq" type="button">Esqueci minha senha</button></p><p><button class="linkbtn" id="reenviar" type="button">Reenviar confirmação de e-mail</button></p></form></div>
</main><div id="foot"></div>
<script>
(async()=>{const {user}=await layout("login.html");if(user&&!erroRetornoAuth()){location.href="index.html";return;}
let mode="login";const m=(t,e)=>{$("#m").hidden=!t;$("#m").textContent=t||"";$("#m").className="msg"+(e?" err":"");};
function set(x){mode=x;$("#tl").setAttribute("aria-selected",x=="login");$("#tc").setAttribute("aria-selected",x!="login");$("#nw").hidden=x=="login";$("#ok").textContent=x=="login"?"Entrar":"Criar conta";$("#esq").hidden=x!="login";m();}
$("#esq").onclick=async()=>{const email=$("#email").value.trim();
 if(!email){m("Digite seu e-mail no campo acima e clique de novo em “Esqueci minha senha”.",1);$("#email").focus();return}
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:new URL("/conta",location.origin).href});
 if(error){m(mensagemAuth(error,"Não foi possível enviar o link de recuperação agora. Tente novamente."),1);return;}
 m("Se este e-mail tiver cadastro, enviamos um link para criar uma nova senha. Veja também a caixa de spam.");};
$("#reenviar").onclick=async()=>{
 const campo=$("#email"), botao=$("#reenviar");
 if(!campo.value.trim()||!campo.checkValidity()){m("Digite um e-mail válido para reenviar a confirmação.",1);campo.focus();return;}
 botao.disabled=true;
 try{
  const {error}=await sb.auth.resend({type:"signup",email:campo.value.trim(),options:{emailRedirectTo:new URL("/confirmar-email",location.origin).href}});
  m(error?mensagemAuth(error,"Não foi possível reenviar a confirmação agora. Tente novamente."):"Se sua conta estiver aguardando confirmação, enviaremos um novo link. Confira também o spam.",!!error);
 }catch{m("Não foi possível reenviar a confirmação agora. Tente novamente.",1);}
 finally{botao.disabled=false;}
};
if(erroRetornoAuth()){
 m(mensagemAuth({code:retornoAuth.get("error_code")},"Não foi possível usar este link. Solicite um novo."),1);
 limparRetornoAuth();
}
$("#tl").onclick=()=>set("login");$("#tc").onclick=()=>set("cad");
$("#f").onsubmit=async e=>{e.preventDefault();const email=$("#email").value,password=$("#senha").value;$("#ok").disabled=true;
 try{
 if(mode=="login"){const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)m(mensagemAuth(error,"Não foi possível entrar agora. Tente novamente."),1);else location.href=(["admin","editor"].includes(await getRole(await getUser())))?"admin.html":"index.html";}
 else{const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:new URL("/confirmar-email",location.origin).href,data:{nome:$("#nome").value}}});
  if(error)m(mensagemAuth(error,"Não foi possível criar a conta agora. Tente novamente."),1);
  else if(data.session)location.href="index.html";else m("Conta criada. Confirme seu e-mail pelo link que enviamos e depois entre.");}
 }catch{m("Não foi possível concluir agora. Tente novamente.",1);}
 finally{$("#ok").disabled=false;}};})();
</script></body></html>
