<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha conta · Vozes dos Palmares</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script></head>
<body><div id="top"></div><main>
<div class="wrap"><div class="page-title"><h1>Minha conta</h1><p class="lead">Altere o e-mail de acesso ou a senha quando quiser.</p></div>
<div id="cc"></div></div>
</main><div id="foot"></div>
<script>
(async()=>{const {user,role}=await layout("conta.html"),cc=$("#cc");
if(!user){cc.innerHTML='<p class="msg">Para alterar seus dados, <a href="login.html">entre na sua conta</a>.</p>';return}
const papel={admin:"Administrador",editor:"Editor",user:"Usuário"}[role]||"Usuário";
cc.innerHTML=`<p class="lead">Conectada como <strong id="em"></strong> · permissão: ${papel}</p>
<div id="cm" class="msg" hidden role="status"></div>
<form class="box" id="fs"><h2>Alterar senha</h2><label for="ns">Nova senha</label><input id="ns" type="password" required minlength="6" autocomplete="new-password"><label for="nc">Repita a nova senha</label><input id="nc" type="password" required minlength="6" autocomplete="new-password"><p class="muted" style="font-size:.9rem">Mínimo de 6 caracteres; prefira 8 ou mais, com letras e números.</p><p><button class="btn">Salvar nova senha</button></p></form>
<form class="box" id="fe"><h2>Alterar e-mail</h2><label for="ne">Novo e-mail</label><input id="ne" type="email" required maxlength="200" autocomplete="email"><p class="muted" style="font-size:.9rem">Enviaremos um link de confirmação. O e-mail de acesso só muda depois que você confirmar.</p><p><button class="btn">Alterar e-mail</button></p></form>`;
$("#em").textContent=user.email;
const say=(t,x)=>{const m=$("#cm");m.hidden=false;m.textContent=t;m.className="msg"+(x?" err":"");m.scrollIntoView({block:"center"})};
if(RECUPERANDO)say("Defina sua nova senha abaixo.");
$("#fs").onsubmit=async e=>{e.preventDefault();const a=$("#ns").value;if(a!==$("#nc").value)return say("As senhas não conferem.",1);
 const {error}=await sb.auth.updateUser({password:a});if(error)say("Não foi possível alterar a senha: "+error.message,1);else{say("Senha alterada com sucesso. Use a nova senha no próximo acesso.");e.target.reset()}};
$("#fe").onsubmit=async e=>{e.preventDefault();const n=$("#ne").value.trim();
 const {error}=await sb.auth.updateUser({email:n},{emailRedirectTo:new URL("conta.html",location.href).href});
 if(error)say("Não foi possível alterar o e-mail: "+error.message,1);else{say("Enviamos um link de confirmação para "+n+". O e-mail só muda depois que você clicar nele.");e.target.reset()}};
})();
</script></body></html>
